<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="pwaBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1626"/>
      <stop offset="50%" stop-color="#090D16"/>
      <stop offset="100%" stop-color="#05080E"/>
    </linearGradient>
    <linearGradient id="pwaGlassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(30, 42, 68, 0.72)"/>
      <stop offset="100%" stop-color="rgba(14, 21, 37, 0.88)"/>
    </linearGradient>
    <linearGradient id="pwaAzure" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <radialGradient id="pwaHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0EA5E9" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#38BDF8" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#090D16" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Full Background Canvas (Safe for maskable icons) -->
  <rect width="512" height="512" fill="url(#pwaBgGrad)"/>

  <!-- Ambient Light Emission -->
  <circle cx="256" cy="256" r="210" fill="url(#pwaHalo)"/>

  <!-- Liquid Frosted Glass Plate (Maskable safe area: 80% of 512 = 410px, centered) -->
  <rect x="68" y="68" width="376" height="376" rx="92" fill="url(#pwaGlassGrad)" stroke="rgba(255, 255, 255, 0.14)" stroke-width="4"/>
  <rect x="72" y="72" width="368" height="184" rx="88" fill="url(#pwaGlassGrad)" opacity="0.25"/>

  <!-- Outer Orbital Focus Track -->
  <circle cx="256" cy="256" r="136" stroke="url(#pwaAzure)" stroke-width="12" stroke-linecap="round" stroke-dasharray="640 180" filter="url(#softGlow)"/>
  
  <!-- Secondary Synchronized Ring -->
  <circle cx="256" cy="256" r="96" stroke="rgba(56, 189, 248, 0.35)" stroke-width="5" stroke-dasharray="14 14"/>

  <!-- Deliberate Focus Sanctuary Star -->
  <path d="M256 160C256 212 298 256 352 256C298 256 256 300 256 352C256 300 214 256 160 256C214 256 256 212 256 160Z" fill="url(#pwaAzure)" filter="url(#softGlow)"/>
  
  <!-- Radiant Core Spark -->
  <circle cx="256" cy="256" r="18" fill="#F8FAFC"/>
  <circle cx="256" cy="256" r="8" fill="#38BDF8"/>
</svg>
