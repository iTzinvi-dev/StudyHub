<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="pwaFlameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <radialGradient id="pwaFlameCore" cx="50%" cy="60%" r="40%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pwaHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0EA5E9" stop-opacity="0.3"/>
      <stop offset="60%" stop-color="#38BDF8" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#090D16" stop-opacity="0"/>
    </radialGradient>
    <filter id="flameGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Full Background (maskable safe) -->
  <rect width="512" height="512" fill="#090D16"/>

  <!-- Ambient Glow -->
  <circle cx="256" cy="256" r="220" fill="url(#pwaHalo)"/>

  <!-- Main Flame Shape -->
  <path d="M256 48C256 48 160 144 160 240C160 288 176 320 200 344C184 304 192 264 216 232C216 232 224 288 256 320C288 288 296 232 296 232C320 264 328 304 312 344C336 320 352 288 352 240C352 144 256 48 256 48Z" fill="url(#pwaFlameGrad)" filter="url(#flameGlow)"/>

  <!-- Inner Flame -->
  <path d="M256 176C256 176 208 240 208 288C208 320 224 344 256 360C288 344 304 320 304 288C304 240 256 176 256 176Z" fill="url(#pwaFlameCore)" opacity="0.7"/>

  <!-- Core Spark -->
  <circle cx="256" cy="304" r="24" fill="#F8FAFC"/>
  <circle cx="256" cy="304" r="12" fill="#38BDF8"/>
</svg>
